<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Future Coding Approaches</title>
  <style>
    /* Styling to eliminate margins/scrollbars and center the high-fidelity diagram */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f7f9fa;
      overflow: hidden;
      font-family: system-ui, -apple-system, Arial, sans-serif;
    }
    svg {
      width: 100%;
      height: 100%;
      max-width: 1200px;
      max-height: 800px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- High-fidelity SVG diagram with viewBox="0 0 1200 800" -->
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <!-- Pure white background rect covering the entire 1200x800 canvas -->
    <rect width="1200" height="800" fill="#FFFFFF" />

    <!-- Connection lines placed behind node rectangles to ensure clean border rendering -->
    <g id="connection-lines">
      <!-- 
        Root bottom center: (600, 150)
        Split level for main trunk: (600, 190)
        Left Domain top center: (340, 230)
        Right Domain top center: (860, 230)
        
        Left Domain bottom center: (340, 350)
        Split level for Left Leafs: (340, 390)
        Manual Leaf top center: (210, 430)
        Agentic Leaf top center: (470, 430)
        
        Right Domain bottom center: (860, 350)
        Split level for Right Leafs: (860, 390)
        Vibe Leaf top center: (730, 430)
        Spec Leaf top center: (990, 430)
      -->
      <path d="M 600,150 L 600,190 
               M 600,190 L 340,190 L 340,230 
               M 600,190 L 860,190 L 860,230 
               M 340,350 L 340,390 
               M 340,390 L 210,390 L 210,430 
               M 340,390 L 470,390 L 470,430 
               M 860,350 L 860,390 
               M 860,390 L 730,390 L 730,430 
               M 860,390 L 990,390 L 990,430" 
            fill="none" 
            stroke="#0000FF" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>

    <!-- Node Boxes & Borders (Round borders with solid 2px blue border and pure white fill) -->
    <g id="node-boxes">
      <!-- Root Node -->
      <rect x="350" y="50" width="500" height="100" rx="15" fill="#FFFFFF" stroke="#0000FF" stroke-width="2" />

      <!-- Left Domain Node -->
      <rect x="160" y="230" width="360" height="120" rx="12" fill="#FFFFFF" stroke="#0000FF" stroke-width="2" />

      <!-- Right Domain Node -->
      <rect x="680" y="230" width="360" height="120" rx="12" fill="#FFFFFF" stroke="#0000FF" stroke-width="2" />

      <!-- Leaf Nodes -->
      <!-- Manual Leaf -->
      <rect x="100" y="430" width="220" height="240" rx="12" fill="#FFFFFF" stroke="#0000FF" stroke-width="2" />
      <!-- Agentic Leaf -->
      <rect x="360" y="430" width="220" height="240" rx="12" fill="#FFFFFF" stroke="#0000FF" stroke-width="2" />
      <!-- Vibe Leaf -->
      <rect x="620" y="430" width="220" height="240" rx="12" fill="#FFFFFF" stroke="#0000FF" stroke-width="2" />
      <!-- Spec Leaf -->
      <rect x="880" y="430" width="220" height="240" rx="12" fill="#FFFFFF" stroke="#0000FF" stroke-width="2" />
    </g>

    <!-- Node Content (Icons & Texts) -->
    <g id="node-contents">
      
      <!-- === ROOT NODE === -->
      <!-- Root Icon (Code Symbol </>) - Stroke is solid Blue (#0000FF) per Spec -->
      <g transform="translate(440, 83) scale(1.25)">
        <path d="M 6,6 L -2,12 L 6,18" fill="none" stroke="#0000FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 15,4 L 9,20" fill="none" stroke="#0000FF" stroke-width="2.5" stroke-linecap="round" />
        <path d="M 18,6 L 26,12 L 18,18" fill="none" stroke="#0000FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <!-- Root Text (Solid Blue as per Spec) -->
      <text x="490" y="110" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="32" font-weight="bold" letter-spacing="-0.5px" fill="#0000FF">Coding Approaches</text>


      <!-- === LEFT DOMAIN NODE === -->
      <!-- Left Domain Icon (Human Avatar) - Stroke is solid Blue (#0000FF) per Spec -->
      <g transform="translate(190, 265) scale(1.6)">
        <circle cx="16" cy="10" r="5" fill="none" stroke="#0000FF" stroke-width="2" />
        <path d="M 6,24 C 6,18 10,16 16,16 C 22,16 26,18 26,24" fill="none" stroke="#0000FF" stroke-width="2" stroke-linecap="round" />
      </g>
      <!-- Left Domain Text (Solid Blue as per Spec) -->
      <text x="260" y="285" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0000FF">Human Coding</text>
      <text x="260" y="315" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0000FF" opacity="0.8">Developed and owned by humans</text>


      <!-- === RIGHT DOMAIN NODE === -->
      <!-- Right Domain Icon (Robot Head) - Stroke & Fill is solid Blue (#0000FF) per Spec -->
      <g transform="translate(710, 265) scale(1.6)">
        <line x1="6" y1="16" x2="2" y2="16" stroke="#0000FF" stroke-width="2" stroke-linecap="round" />
        <line x1="26" y1="16" x2="30" y2="16" stroke="#0000FF" stroke-width="2" stroke-linecap="round" />
        <line x1="16" y1="8" x2="16" y2="3" stroke="#0000FF" stroke-width="2" stroke-linecap="round" />
        <circle cx="16" cy="2" r="1.5" fill="#0000FF" />
        <rect x="6" y="8" width="20" height="16" rx="4" fill="none" stroke="#0000FF" stroke-width="2" />
        <circle cx="11" cy="14" r="1.5" fill="#0000FF" />
        <circle cx="21" cy="14" r="1.5" fill="#0000FF" />
        <line x1="12" y1="19" x2="20" y2="19" stroke="#0000FF" stroke-width="2" stroke-linecap="round" />
      </g>
      <!-- Right Domain Text (Solid Blue as per Spec) -->
      <text x="780" y="285" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0000FF">Agent Coding</text>
      <text x="780" y="315" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0000FF" opacity="0.8">Generated and guided by AI agents</text>


      <!-- === LEAF 1: MANUAL === -->
      <!-- Icon (Pencil) - Stroke is solid Blue (#0000FF) per Spec -->
      <g transform="translate(189.2, 483) scale(1.3)">
        <rect x="12" y="4" width="8" height="16" rx="1" transform="rotate(45 16 12)" fill="none" stroke="#0000FF" stroke-width="2" />
        <path d="M 8,16 L 6,22 L 12,20 Z" fill="none" stroke="#0000FF" stroke-width="2" />
      </g>
      <!-- Text (Solid Blue as per Spec) -->
      <text x="210" y="565" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0000FF" text-anchor="middle">Manual</text>
      <text x="210" y="605" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0000FF" opacity="0.7" text-anchor="middle">Write and improve</text>
      <text x="210" y="625" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0000FF" opacity="0.7" text-anchor="middle">code by hand</text>


      <!-- === LEAF 2: AGENTIC === -->
      <!-- Icon (Agentic Badge) - Stroke is solid Blue (#0000FF) per Spec -->
      <g transform="translate(447.9, 483) scale(1.3)">
        <path d="M 6,24 C 6,18 10,16 16,16 C 18,16 19.5,16.5 20,18" fill="none" stroke="#0000FF" stroke-width="2" stroke-linecap="round" />
        <circle cx="16" cy="10" r="5" fill="none" stroke="#0000FF" stroke-width="2" />
        <path d="M 22,24 L 28,24 L 28,18" fill="none" stroke="#0000FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 18,24 C 18,20 22,18 28,18" fill="none" stroke="#0000FF" stroke-width="2" stroke-linecap="round" />
      </g>
      <!-- Text (Solid Blue as per Spec) -->
      <text x="470" y="565" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0000FF" text-anchor="middle">Agentic</text>
      <text x="470" y="605" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0000FF" opacity="0.7" text-anchor="middle">Use AI agents to assist</text>
      <text x="470" y="625" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0000FF" opacity="0.7" text-anchor="middle">or automate coding tasks</text>


      <!-- === LEAF 3: VIBE === -->
      <!-- Icon (Lightning Bolt) - Stroke is solid Blue (#0000FF) per Spec -->
      <g transform="translate(709.2, 483) scale(1.3)">
        <path d="M 18,2 L 8,14 L 15,14 L 12,26 L 24,12 L 17,12 Z" fill="none" stroke="#0000FF" stroke-width="2" stroke-linejoin="round" />
      </g>
      <!-- Text (Solid Blue as per Spec) -->
      <text x="730" y="565" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0000FF" text-anchor="middle">Vibe</text>
      <text x="730" y="605" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0000FF" opacity="0.7" text-anchor="middle">AI generates code based</text>
      <text x="730" y="625" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0000FF" opacity="0.7" text-anchor="middle">on intent and context</text>


      <!-- === LEAF 4: SPEC === -->
      <!-- Icon (Document) - Stroke is solid Blue (#0000FF) per Spec -->
      <g transform="translate(969.2, 483) scale(1.3)">
        <path d="M 6,4 L 20,4 L 26,10 L 26,26 L 6,26 Z" fill="none" stroke="#0000FF" stroke-width="2" stroke-linejoin="round" />
        <path d="M 20,4 L 20,10 L 26,10" fill="none" stroke="#0000FF" stroke-width="2" stroke-linejoin="round" />
        <line x1="10" y1="14" x2="22" y2="14" stroke="#0000FF" stroke-width="1.5" stroke-linecap="round" />
        <line x1="10" y1="18" x2="22" y2="18" stroke="#0000FF" stroke-width="1.5" stroke-linecap="round" />
        <line x1="10" y1="22" x2="18" y2="22" stroke="#0000FF" stroke-width="1.5" stroke-linecap="round" />
      </g>
      <!-- Text (Solid Blue as per Spec) -->
      <text x="990" y="565" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0000FF" text-anchor="middle">Spec</text>
      <text x="990" y="605" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0000FF" opacity="0.7" text-anchor="middle">AI develops code from</text>
      <text x="990" y="625" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0000FF" opacity="0.7" text-anchor="middle">explicit specifications</text>

    </g>
  </svg>

</body>
</html>
